name: Upload to Allure server
description: Upload some Allure results to an Allure Server instance

inputs:
  url:
    description: Allure Server root url
    required: true
  username:
    description: Allure Server authentication username (Basic Auth)
    required: true
  password:
    description: Allure Server authentication password (Basic Auth)
    required: true
  results:
    description: Path to the Allure results directory to upload
    required: false
    default: allure-result

outputs:
  response:
    description: The Allure Server upload JSON response
    value: ${{ steps.upload.outputs.response }}
  uuid:
    description: The result upload unique identifier
    value: ${{ steps.upload.outputs.uuid }}

runs:
  using: composite
  steps:

    - name: Zip Allure results
      run: |
        : Zip Allure results
        cd ${{ inputs.results }} && zip -r ${{ github.workspace }}/allure.zip *
      shell: bash

    - name: Upload Allure results
      id: upload
      env:
        ALLURE_URL: ${{ inputs.url }}
        ALLURE_USERNAME: ${{ inputs.username }}
        ALLURE_PASSWORD: ${{ inputs.password }}
      run: |
        : Upload Allure results

        ZIP_PATH="${{ github.workspace }}/allure.zip"
        BODY_FILE="$(mktemp)"
        trap 'rm -f "${BODY_FILE}"' EXIT

        set +e
        http_code=$(curl --silent --show-error \
          --fail-with-body \
          --user "${ALLURE_USERNAME}:${ALLURE_PASSWORD}" \
          --header 'accept: */*' \
          --form "allureResults=@${ZIP_PATH};type=application/x-zip-compressed" \
          --output "${BODY_FILE}" \
          --write-out '%{http_code}' \
          --max-time 300 \
          --request POST "${ALLURE_URL}/api/result")
        curl_rc=$?
        set -e

        response="$(cat "${BODY_FILE}")"

        fail() {
          local msg="$1"
          local zip_size
          zip_size=$(du -h "${ZIP_PATH}" 2>/dev/null | cut -f1)
          zip_size="${zip_size:-?}"
          echo "::error::${msg}"
          echo "  URL:        ${ALLURE_URL}/api/result"
          echo "  curl exit:  ${curl_rc}"
          echo "  HTTP code:  ${http_code:-<none>}"
          echo "  Zip size:   ${zip_size}"
          echo "  Response body: (if ACTIONS_STEP_DEBUG is 'true')"
          while IFS= read -r line; do
            echo "::debug::body: ${line}"
          done <<< "${response:0:2000}"
          exit 1
        }

        if [[ "${curl_rc}" -ne 0 ]]; then
          fail "Allure upload failed (curl exit ${curl_rc})"
        fi

        if [[ -z "${response}" ]]; then
          fail "Allure server returned empty body (HTTP ${http_code})"
        fi

        UUID="$(printf '%s' "${response}" | jq -e -r .uuid 2>/dev/null)" \
          || fail "Allure server reply was not JSON with .uuid (HTTP ${http_code})"

        {
          echo "response<<EOF"
          printf '%s\n' "${response}"
          echo "EOF"
          echo "uuid=${UUID}"
        } >> "${GITHUB_OUTPUT}"
        echo "📊 Uploaded result ${UUID} (HTTP ${http_code})"
      shell: bash
