name: Initialize `pdm`
description: Install Python and `pdm` with cache and extract metadata

inputs:
  working-directory:
    description: Working directory for the project (relative to repo root)
    default: '.'
  python-version:
    description: >-
      Python version to use
      (defaults to `.python-version` if present, else to the lower bound of `requires-python`)
  extra-python-versions:
    description: >-
      Additional Python versions to install, one per line,
      for projects testing against several interpreters (requires `uv`)
    default: ''
  group:
    description: Dependency group(s) to install
    default: ''
  exclude-group:
    description: Dependency group(s) to exclude from install
    default: ''
  history:
    description: Fetch the full history
    required: false
    default: 'false'
  github-token:
    description: A Github token with proper permissions
    required: false
    default: ${{ github.token }}
  skip-dependencies:
    description: Skip dependencies installation
  cache:
    description: Cache the dependencies (only used when dependencies are installed)
    default: 'true'

outputs:
  identifier:
    description: The short project identifier
    value: ${{ steps.meta.outputs.identifier }}
  has_tests:
    description: Whether the project has tests exposed through the `test` command
    value: ${{ steps.meta.outputs.has_tests }}
  has_coverage:
    description: Whether the project has tests with coverage exposed through the `cover` command
    value: ${{ steps.meta.outputs.has_coverage }}
  has_docs:
    description: Whether the project has a documentation exposed through the `doc` command
    value: ${{ steps.meta.outputs.has_docs }}
  has_openapi:
    description: Whether the project has an OpenAPI specification exposed through the `doc:openapi` command
    value: ${{ steps.meta.outputs.has_openapi }}
  has_docker:
    description: Whether the project a Docker image (aka. a `Dockerfile` present at root)
    value: ${{ steps.meta.outputs.has_docker }}
  has_src:
    description: Whether the project is using a `src` layout or not
    value: ${{ steps.meta.outputs.has_src }}
  has_backstage:
    description: Whether the project is exposing Backstage catalog infos
    value: ${{ steps.meta.outputs.has_backstage }}
  is_distribution:
    description: Whether the project is a distribution or not
    value: ${{ steps.meta.outputs.is_distribution }}
  is_pr:
    description: Is the current workflow run a pull-request
    value: ${{ steps.meta.outputs.is_pr }}
  branch:
    description: The branch from which workflow has been triggered
    value: ${{ steps.meta.outputs.branch }}
  has_jfrog:
    description: Whether this project uses JFrog Artifactory or not
    value: ${{ steps.detect.outputs.has_jfrog }}
  jfrog-domain:
    description: Base domain of Ledger's JFrog platform if authenticated
    value: ${{ steps.jfrog-login.outputs.jfrog-domain }}
  jfrog-url:
    description: Base URL of Ledger's JFrog platform if authenticated
    value: ${{ steps.jfrog-login.outputs.jfrog-url }}
  jfrog-user:
    description: Username extracted from the OIDC token if authenticated
    value: ${{ steps.jfrog-login.outputs.oidc-user }}
  jfrog-token:
    description: OIDC token generated by JFrog CLI if authenticated
    value: ${{ steps.jfrog-login.outputs.oidc-token }}
  python-version:
    description: The Python version used by this action
    value: ${{ steps.setup-pdm.outputs.python-version || steps.setup-uv-pdm.outputs.python-version }}
  pdm-version:
    description: The version of `pdm` used by this action
    value: ${{ steps.setup-pdm.outputs.pdm-version || steps.setup-uv-pdm.outputs.pdm-version }}
  use_uv:
    description: Whether this project uses uv as PDM backend
    value: ${{ steps.detect.outputs.use_uv }}


runs:
  using: composite
  steps:
    - name: Clone
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.github-token }}
        fetch-depth: ${{ inputs.history == 'true' && '0' || '1' }}

    - name: Setup git
      run: |
        : Setup git
        git config user.name github-actions
        git config user.email github-actions@ledger.fr
      shell: bash

    - name: Detect JFrog and uv requirements
      id: detect
      working-directory: ${{ inputs.working-directory }}
      run: |
        : Detect JFrog and uv requirements
        PYPROJECT="pyproject.toml"
        HAS_JFROG=$(grep "jfrog" "${PYPROJECT}" > /dev/null && echo "true" || echo "false")
        echo "has_jfrog=${HAS_JFROG}" >> $GITHUB_OUTPUT
        USE_UV=$([ -f pdm.toml ] && yq '.use_uv' pdm.toml || true)
        echo "use_uv=${USE_UV:-false}" >> $GITHUB_OUTPUT
        # If `uv` is enabled, we will use it to manually install dependencies, otherwise we'll use `pip`.
        echo "PIP=$([[ ${USE_UV} = true ]] && echo 'uv pip' || echo 'pip')" >> $GITHUB_ENV
        # Without an explicit version nor a `.python-version` file (which `uv` honors on its own),
        # fallback on the lower bound of `requires-python`: it is deterministic and libraries are
        # set up on their minimal supported version.
        if [ -z "${PYTHON_VERSION}" ] && [ ! -f .python-version ] && [ ! -f "${GITHUB_WORKSPACE}/.python-version" ]; then
          # Never fail on projects without a parseable `requires-python`: `uv` will resolve it
          PYTHON_VERSION=$(yq -p toml -oy '.project.requires-python' "${PYPROJECT}" | grep -oE '[0-9]+\.[0-9]+' | head -1 || true)
        fi
        echo "python-version=${PYTHON_VERSION}" >> $GITHUB_OUTPUT
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      shell: bash

    - name: Authenticate against JFrog Artifactory
      id: jfrog-login
      if: (steps.detect.outputs.has_jfrog == 'true' || env.JFROG_REPOSITORY) && !env.JFROG_TOKEN
      uses: LedgerHQ/actions-security/actions/jfrog-login@actions/jfrog-login-1

    - name: Set up Python and PDM
      id: setup-pdm
      if: steps.detect.outputs.use_uv != 'true'
      uses: pdm-project/setup-pdm@v4.5
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.working-directory }}/pdm.lock

    # If `uv` is enabled, we install it first and then we use it to install python and pdm as it is way faster.
    # Caching is explicitly disabled: the GitHub Actions cache is served at ~2 MB/s from our self-hosted
    # runners and `setup-uv` prunes the wheel archives anyway, so it measured no gain over fetching from JFrog.
    - name: Install uv
      if: steps.detect.outputs.use_uv == 'true'
      uses: astral-sh/setup-uv@v7
      with:
        activate-environment: true
        python-version: ${{ steps.detect.outputs.python-version }}
        working-directory: ${{ inputs.working-directory }}
        enable-cache: false

    # `uv python install` also exposes `pythonX.Y` executables in `~/.local/bin`,
    # so they are discoverable by `pdm` too.
    - name: Install extra Python versions
      if: steps.detect.outputs.use_uv == 'true' && inputs.extra-python-versions
      run: |
        : Install extra Python versions
        uv python install ${EXTRA_PYTHON_VERSIONS}
      env:
        EXTRA_PYTHON_VERSIONS: ${{ inputs.extra-python-versions }}
      shell: bash

    - name: Install pdm
      id: setup-uv-pdm
      if: steps.detect.outputs.use_uv == 'true'
      run: |
        : Install pdm
        uv pip install pdm
        pdm config python.install_root $(uv python dir --color never)
        echo "python-version=$(python -c 'import platform; print(platform.python_version())')" >> $GITHUB_OUTPUT
        echo "pdm-version=$(pdm --version | awk '{print $3}')" >> $GITHUB_OUTPUT
      shell: bash

    - name: Set some settings
      if: steps.detect.outputs.use_uv != 'true'
      working-directory: ${{ inputs.working-directory }}
      run: |
        : Set some settings
        # Only enabled for the pip/PDM installer: with `uv`, this forces `--link-mode symlink`,
        # producing a virtualenv made of symlinks into `~/.cache/uv` which breaks as soon as the
        # virtualenv is reused, cached or uploaded without the `uv` cache.
        pdm config install.cache true
      shell: bash

    - name: Install dependencies (main, all extras and specified dev group)
      if: inputs.skip-dependencies == null
      working-directory: ${{ inputs.working-directory }}
      run: |
        : Install dependencies
        echo "${{ github.workspace }}/${{ inputs.working-directory }}/.venv/bin/python" > .pdm-python
        params=(--group :all --dev)
        [ -z "${GROUPS}" ] || params+=(--group ${GROUPS})
        [ -z "${EXCLUDED_GROUPS}" ] || params+=(--without ${EXCLUDED_GROUPS})
        [ "${{ runner.debug }}" == "1" ] && params+=(-vv)
        pdm sync "${params[@]}"
      env:
        GROUPS: ${{ inputs.group }}
        EXCLUDED_GROUPS: ${{ inputs.exclude-group }}
      shell: bash

    - name: Extract some metadata
      id: meta
      working-directory: ${{ inputs.working-directory }}
      run: |
        : Extract some metadata
        echo "identifier=$(pdm show --name)" >> $GITHUB_OUTPUT
        echo "branch=${{ github.head_ref || github.ref_name }}" >> $GITHUB_OUTPUT

        COMMANDS=$(pdm run --json)

        HAS_TESTS=$(jq 'has("test")' <<< "$COMMANDS")
        echo "has_tests=${HAS_TESTS}" >> $GITHUB_OUTPUT

        HAS_COVERAGE=$(jq 'has("cover")' <<< "$COMMANDS")
        echo "has_coverage=${HAS_COVERAGE}" >> $GITHUB_OUTPUT

        HAS_DOCS=$(jq 'has("doc")' <<< "$COMMANDS")
        echo "has_docs=${HAS_DOCS}" >> $GITHUB_OUTPUT

        HAS_OPENAPI=$(jq 'has("doc:openapi")' <<< "$COMMANDS")
        echo "has_openapi=${HAS_OPENAPI}" >> $GITHUB_OUTPUT

        [ -f Dockerfile ] && HAS_DOCKER='true' || HAS_DOCKER='false'
        echo "has_docker=${HAS_DOCKER}" >> $GITHUB_OUTPUT

        [ -d src/ ] && HAS_SRC='true' || HAS_SRC='false'
        echo "has_src=${HAS_SRC}" >> $GITHUB_OUTPUT

        [ -f catalog-info.yaml ] && HAS_BACKSTAGE='true' || HAS_BACKSTAGE='false'
        echo "has_backstage=${HAS_BACKSTAGE}" >> $GITHUB_OUTPUT

        IS_PR="${{ github.event_name == 'pull_request' }}"
        echo "is_pr=${IS_PR}" >> $GITHUB_OUTPUT

        IS_DIST=$(grep -E "distribution\s*=\s*true" pyproject.toml > /dev/null && echo "true" || echo "false")
        echo "is_distribution=${IS_DIST}" >> $GITHUB_OUTPUT
      shell: bash
