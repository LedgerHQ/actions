name: SBT build
description: Set up and run an SBT build

inputs:
  command:
    description: SBT command(s) to run
    required: true
  java-version:
    description: Java version
    required: true
    default: "21"
  java-distribution:
    description: Java distribution
    required: true
    default: zulu
  fail-on-missing-link-warnings:
    description: Fail when MissingLink reports unresolved parent classes as warnings.
    required: true
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        cache: sbt

    - name: Setup sbt launcher
      uses: sbt/setup-sbt@v1

    - name: Restore sbt build outputs
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ github.workspace }}/**/target
          ~/.ivy2/local
          ~/.cache/scalablytyped
        key: build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.java-distribution }}-jdk${{ inputs.java-version }}-${{ hashFiles('build.sbt', 'project/**', '**/*.scala', '**/*.sbt') }}
        restore-keys: |
          build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.java-distribution }}-jdk${{ inputs.java-version }}-

    - name: Run sbt
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        FAIL_ON_MISSING_LINK_WARNINGS: ${{ inputs.fail-on-missing-link-warnings }}
      run: |
        set -o pipefail
        log_file=$(mktemp)
        trap 'rm -f "$log_file"' EXIT
        if ! sbt -v "$COMMAND" 2>&1 | tee "$log_file"; then
          echo "::error::sbt run failed"
          exit 1
        fi
        if [ "$FAIL_ON_MISSING_LINK_WARNINGS" = "true" ] \
          && grep -q '^Warning: Cannot find parent .* of class ' "$log_file"; then
          echo "::error::MissingLink found unresolved runtime parent classes"
          exit 1
        fi

    - name: Save sbt build outputs
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ github.workspace }}/**/target
          ~/.ivy2/local
          ~/.cache/scalablytyped
        key: build-${{ runner.os }}-${{ runner.arch }}-${{ inputs.java-distribution }}-jdk${{ inputs.java-version }}-${{ hashFiles('build.sbt', 'project/**', '**/*.scala', '**/*.sbt') }}
