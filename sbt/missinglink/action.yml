name: MissingLink output check
description: Fail when captured MissingLink output reports unresolved runtime parent classes

inputs:
  log-file:
    description: Path to an SBT output log
    required: true

runs:
  using: composite
  steps:
    - name: Check MissingLink output
      shell: bash
      env:
        LOG_FILE: ${{ inputs.log-file }}
      run: |
        if [ ! -f "$LOG_FILE" ]; then
          echo "::error::SBT output log not found: $LOG_FILE"
          exit 1
        fi
        if grep -q '^Warning: Cannot find parent .* of class ' "$LOG_FILE"; then
          echo "::error::MissingLink found unresolved runtime parent classes"
          exit 1
        fi
